spring.application.name=roman-sites

# Secrets (e.g. OPENCODE_API_KEY) live in roman-sites-backend/.env, which is git-ignored.
spring.config.import=optional:file:.env[.properties]

# AI chat via OpenCode's OpenAI-compatible API. OpenCode's free models only work inside the
# OpenCode app, so this uses a low-cost paid model; see https://opencode.ai/docs/zen/ for others.
opencode.api-key=${OPENCODE_API_KEY:}
opencode.base-url=https://opencode.ai/inference/openai/v1
opencode.model=glm-5.3-flash

# H2 Database settings
# Stored on disk in roman-sites-backend/data/ so added sites survive restarts.
# Delete that folder to start over from the seed data.
# (No DATABASE_TO_UPPER=false: with it Hibernate can't see existing tables, so new columns never get added.)
spring.datasource.url=jdbc:h2:file:./data/roman-sites
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Enable the H2 Console
spring.h2.console.enabled=true
# Optional: Set a specific path (default is /h2-console)
spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true
# Sites are seeded once by DataSeeder, not on every start.
spring.sql.init.mode=never

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

